name: Flush Telegram queue

on:
  schedule:
    # Every 6 hours — at most one Telegram post per run
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: telegram-flush
  cancel-in-progress: false

jobs:
  flush:
    name: Flush one Telegram post
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Flush at most one queued post
        id: flush
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scripts/news_scraper.py --flush-telegram
          if git diff --quiet -- data/telegram_queue.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist Telegram queue
        if: steps.flush.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(news): flush telegram queue"
          branch: chore/telegram-queue
          delete-branch: true
          title: "chore(news): flush telegram queue"
          body: |
            Automated Telegram flush (max 1 post / 6 hours).
          add-paths: |
            data/telegram_queue.json

      - name: Enable auto-merge when checks pass
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --merge --auto || \
            echo "Auto-merge unavailable; PR left open: ${{ steps.cpr.outputs.pull-request-url }}"
