name: Flush Telegram queue

on:
  schedule:
    # GitHub cron is often hours late. Run often; the script posts at most
    # once per UTC 6-hour slot (00/06/12/18 = NZ 12/18/00/06).
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: telegram-queue
  cancel-in-progress: false

jobs:
  flush:
    name: Flush one Telegram post
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Flush at most one queued post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u scripts/news_scraper.py --flush-telegram
