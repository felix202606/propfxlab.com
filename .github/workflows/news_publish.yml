name: Publish news after merge

on:
  push:
    branches: [main]
    paths:
      - "data/news/**"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Space-separated news slugs (empty = detect from last push)"
        required: false
        default: ""

concurrency:
  group: news-publish
  cancel-in-progress: false

jobs:
  publish:
    name: IndexNow + Telegram queue
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: IndexNow + enqueue Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SLUGS: ${{ inputs.slugs }}
        run: |
          set -euo pipefail
          slugs=()
          if [ -n "${INPUT_SLUGS// }" ]; then
            # shellcheck disable=SC2206
            slugs=(${INPUT_SLUGS})
          else
            mapfile -t slugs < <(
              git diff --name-only --diff-filter=A HEAD~1 HEAD -- data/news/ \
                | sed -n 's|^data/news/\(.*\)\.json$|\1|p'
            )
          fi

          if [ "${#slugs[@]}" -eq 0 ]; then
            echo "No news slugs to publish"
            exit 0
          fi

          echo "Articles: ${slugs[*]}"
          if [ "${{ github.event_name }}" = "push" ]; then
            sleep 45
          else
            sleep 15
          fi

          python -u scripts/news_scraper.py --notify-indexnow "${slugs[@]}"
          python -u scripts/news_scraper.py --enqueue-telegram "${slugs[@]}"
