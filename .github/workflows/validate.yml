name: Validate firm data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-firms:
    name: Zod-check data/firms
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate firm JSON against Zod schema
        run: npm run validate:firms
